    <script>
      // Aplica o tema antes da renderização para evitar "piscar" a tela.
      (function () {
        var tema = 'dark';
        try {
          var salvo = localStorage.getItem('190a:tema');
          if (salvo === 'light' || salvo === 'dark') tema = salvo;
          else if (localStorage.getItem('darkMode') === 'false') tema = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'light' ? '#f4f4f6' : '#0a0a0c');
      })();
    </script>
